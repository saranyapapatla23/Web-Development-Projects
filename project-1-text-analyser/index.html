<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Text Analyzer</h1>

        <textarea 
            id="textInput" 
            placeholder="Enter your text here..."
        ></textarea>

        <div class="buttons">
            <button id="lengthBtn">Length</button>
            <button id="upperBtn">Uppercase</button>
            <button id="lowerBtn">Lowercase</button>
            <button id="sliceBtn">Slice</button>
            <button id="replaceBtn">Replace</button>
            <button id="clearBtn">Clear</button>
            <button id="trimBtn">Trim</button>
            <button id="wordCount">Word Count</button>
            <button id ="contains">contains</button>
            <button id="reverse">Reverse Text</button>
            <button id="starts">Starts with</button>
            <button id="ends">Ends with</button>
            <button id="char">Total Number Of Characters</button>
            <button id="index">Char at this index</button>
            <button id="first">First Character</button>
            <button id="last">Last Character</button>
        </div>

        <div class="result">
            <h2>Result</h2>
            <p id="output">Your result will appear here...</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
